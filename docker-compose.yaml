services:
  app:
    image: online-cinema
    container_name: my_cinema
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8000:8000

  db:
    image: 'postgres:latest'
    container_name: postgres_cinema
    env_file:
      - .env
    ports:
      - "5433:5432"

  minio:
    image: minio/minio:latest
    container_name: minio-cinema
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env